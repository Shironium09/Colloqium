<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Colloquium — Computer Science & Technology Conferences Directory</title>
    <meta name="title" content="Colloquium — Computer Science & Technology Conferences Directory" />
    <meta
      name="description"
      content="Browse verified Computer Science and Technology academic conferences. Compare registration fees in USD and PHP, track submission and abstract deadlines, check hybrid/virtual formats, and explore past publisher proceedings."
    />
    <meta
      name="keywords"
      content="computer science conferences, academic conferences, IEEE conferences, ACM conferences, call for papers, CFP, conference deadlines, registration fees, technology conferences, conference scraper, Colloquium"
    />
    <meta name="author" content="Colloquium" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://colloquium.app/" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF5EE" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181A" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://colloquium.app/" />
    <meta property="og:site_name" content="Colloquium" />
    <meta property="og:title" content="Colloquium — Computer Science & Technology Conferences" />
    <meta
      property="og:description"
      content="Discover upcoming Computer Science and Technology academic conferences. Track deadlines, compare registration fees in USD & PHP, and explore publication history."
    />
    <meta property="og:image" content="https://colloquium.app/favicon.svg" />
    <meta property="og:image:alt" content="Colloquium Brand Emblem" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://colloquium.app/" />
    <meta name="twitter:title" content="Colloquium — Computer Science & Technology Conferences" />
    <meta
      name="twitter:description"
      content="Discover upcoming Computer Science and Technology academic conferences. Track deadlines, compare registration fees in USD & PHP, and explore publication history."
    />
    <meta name="twitter:image" content="https://colloquium.app/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://colloquium.app/#website",
            "url": "https://colloquium.app/",
            "name": "Colloquium",
            "description": "Discover upcoming Computer Science and Technology academic conferences with verified fees, deadlines, and publication history.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://colloquium.app/?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "CollectionPage",
            "@id": "https://colloquium.app/#webpage",
            "url": "https://colloquium.app/",
            "name": "Computer Science & Technology Conferences Directory",
            "isPartOf": {
              "@id": "https://colloquium.app/#website"
            },
            "about": {
              "@type": "Thing",
              "name": "Academic Conferences in Computer Science and Technology"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
